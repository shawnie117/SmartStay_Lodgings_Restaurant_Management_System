<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guest Login — SmartStay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    body { background: var(--bg-tertiary); }
    .guest-login { max-width: 420px; margin: 0 auto; padding: var(--space-2xl) var(--space-lg); }
    .guest-login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-xl); }
    .guest-login-card h1 { font-size: 1.4rem; margin-bottom: var(--space-sm); }
    .guest-login-card p { color: var(--fg-secondary); margin-bottom: var(--space-lg); }
  </style>
</head>
<body>
  <div class="guest-login">
    <div class="guest-login-card">
      <h1>Guest Portal Login</h1>
      <p>Use your room number and the guest pass provided at check-in.</p>

      <div class="alert alert-danger" th:if="${param.error}">Invalid room number or guest pass.</div>

      <form th:action="@{/guest/login}" method="post">
        <div class="form-group">
          <label class="form-label" for="roomNumber">Room Number</label>
          <input type="text" id="roomNumber" name="roomNumber" class="form-input" placeholder="e.g. 301" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="guestPass">Guest Pass</label>
          <input type="password" id="guestPass" name="guestPass" class="form-input" placeholder="6-digit pass" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Enter Guest Portal</button>
      </form>

      <div class="text-small text-muted" style="margin-top:var(--space-md)">Need help? Call reception at ext. 0.</div>
    </div>
  </div>
</body>
</html>
