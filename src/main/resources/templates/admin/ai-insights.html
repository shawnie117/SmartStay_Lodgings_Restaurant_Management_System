<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insights - SmartStay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#0d1117;color:#fff}.chat-area{height:60vh;overflow:auto;background:#071025;padding:1rem;border-radius:8px}</style>
</head>
<body class="p-4">
<div class="container">
    <h2>SmartStay AI Insights</h2>

    <div id="chatMessages" class="chat-area mb-3"></div>

    <div class="input-group">
        <input id="userInput" type="text" class="form-control" placeholder="Ask about hotel data..." />
        <button id="sendBtn" class="btn btn-warning">Send</button>
    </div>

    <script th:inline="javascript">
        const chatEndpoint = /*[[${'/admin/ai-insights/chat'}]]*/ '/admin/ai-insights/chat';

        document.getElementById('sendBtn').addEventListener('click', sendMessage);

        async function sendMessage(){
            const msg = document.getElementById('userInput').value.trim();
            if(!msg) return;
            appendMessage('user', msg);
            document.getElementById('userInput').value='';
            appendMessage('ai','...');
            const res = await fetch(chatEndpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: msg})});
            const data = await res.json();
            removeLoading();
            appendMessage('ai', data.reply || JSON.stringify(data));
        }

        function appendMessage(role, text){
            const div=document.createElement('div');
            div.className='mb-2 p-2 ' + (role==='user' ? 'text-end' : 'text-start');
            const bubble = document.createElement('div');
            bubble.style.display='inline-block';
            bubble.style.maxWidth='75%';
            bubble.style.padding='8px 12px';
            bubble.style.borderRadius='12px';
            bubble.style.background = role==='user' ? '#1a2a6c' : '#c9a227';
            bubble.style.color = role==='user' ? '#fff' : '#000';
            bubble.innerText = text;
            div.appendChild(bubble);
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function removeLoading(){
            const nodes = document.querySelectorAll('#chatMessages div');
            for(let i=nodes.length-1;i>=0;i--){
                if(nodes[i].innerText==='...'){ nodes[i].remove(); break; }
            }
        }
    </script>
</div>
</body>
</html>
